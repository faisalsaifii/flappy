<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird</title>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3992129122215131"
      crossorigin="anonymous"
    ></script>
    <meta name="google-adsense-account" content="ca-pub-3992129122215131" />

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #111827;
        color: white;
      }

      canvas {
        display: block;
      }
    </style>
  </head>

  <body class="bg-gray-900 text-white">
    <div class="relative w-screen h-screen">
      <!-- MENU -->

      <div
        id="menu"
        class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center z-10"
      >
        <h1 class="text-5xl font-bold mb-6">Flappy Bird</h1>

        <button
          id="startBtn"
          class="px-8 py-3 bg-yellow-400 text-black rounded-xl font-bold text-xl"
        >
          Start Game
        </button>

        <p class="mt-3 opacity-70">Space / Tap</p>
      </div>

      <!-- GAME OVER -->

      <div
        id="gameOver"
        class="hidden absolute inset-0 bg-black/70 flex flex-col items-center justify-center z-10"
      >
        <h1 class="text-4xl font-bold mb-3">Game Over</h1>

        <p id="scoreText"></p>
        <p id="bestText"></p>

        <div
          id="leaderboard"
          class="mt-6 bg-black/40 p-4 rounded-xl w-56 text-center"
        ></div>

        <button
          onclick="restart()"
          class="mt-5 px-6 py-3 bg-green-400 text-black rounded-xl font-bold"
        >
          Play Again
        </button>
      </div>

      <canvas id="game"></canvas>

      <div id="score" class="absolute top-4 left-4 text-3xl font-bold">0</div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
